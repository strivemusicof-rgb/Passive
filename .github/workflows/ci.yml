name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: landrush
          POSTGRES_PASSWORD: landrush
          POSTGRES_DB: landrush_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U landrush"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://landrush:landrush@localhost:5432/landrush_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter server exec prisma migrate deploy
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter server test:e2e
