<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Shipper</title>
<style>
  :root {
    --bg: #070d0b; --panel: #111a16; --panel2: #0d1512; --border: #1f2c26; --text: #f2f6f4;
    --muted: #9aa6a0; --faint: #66726c; --green: #3fd958; --green-dark: #22a93c; --green-soft: #123a1e;
    --red: #ef5350; --amber: #f6b728; --blue: #4c8dff; --radius: 14px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input, select { font: inherit; }
  header { display: flex; align-items: center; gap: 12px; padding: 18px 28px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: rgba(7,13,11,.92); backdrop-filter: blur(6px); z-index: 2; }
  header h1 { font-size: 20px; margin: 0; flex: 1; display: flex; align-items: center; gap: 10px; }
  header h1 span { color: var(--muted); font-weight: 500; font-size: 14px; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 28px 60px; display: grid; gap: 22px; }
  .btn { border: 1px solid var(--border); background: var(--panel); color: var(--text); padding: 9px 16px; border-radius: 10px; cursor: pointer; font-weight: 600; }
  .btn:hover { border-color: #345044; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.primary { background: linear-gradient(#52e86a, var(--green-dark)); color: #06200d; border: 0; }
  .btn.danger { color: var(--red); }
  .btn.small { padding: 6px 11px; font-size: 13px; }
  .btn.link { background: none; border: 0; color: var(--green); padding: 4px 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; display: grid; gap: 12px; }
  .card.selected { border-color: var(--green-dark); }
  .card h2 { margin: 0; font-size: 18px; display: flex; align-items: center; gap: 10px; }
  .meta { color: var(--muted); font-size: 13px; display: grid; gap: 2px; word-break: break-all; }
  .meta b { color: var(--text); font-weight: 600; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .chip { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: #22302a; color: var(--muted); }
  .chip.running { background: #13305a; color: #9cc2ff; }
  .chip.ok { background: var(--green-soft); color: var(--green); }
  .chip.failed, .chip.cancelled { background: #3a1517; color: #ff8a80; }
  .empty { text-align: center; padding: 48px 20px; color: var(--muted); border: 1px dashed var(--border); border-radius: var(--radius); }
  .panel { background: var(--panel2); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .panel-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .panel-head h3 { margin: 0; font-size: 15px; flex: 1; }
  .hint { margin: 12px 16px 0; padding: 10px 14px; border-radius: 10px; background: #3a2c0c; color: #ffd98a; font-size: 14px; }
  .links { padding: 10px 16px 0; display: grid; gap: 4px; font-size: 14px; }
  .links a { color: #8fd3ff; word-break: break-all; }
  pre { margin: 0; padding: 14px 16px; max-height: 420px; overflow: auto; font: 12.5px/1.5 ui-monospace, Consolas, monospace; color: #c9d4ce; white-space: pre-wrap; word-break: break-word; }
  pre .step { color: var(--green); font-weight: 700; }
  pre .cmd { color: var(--faint); }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 16px; padding: 0; width: min(560px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  form { display: grid; gap: 14px; padding: 22px; }
  form h2 { margin: 0 0 4px; font-size: 19px; }
  label { display: grid; gap: 5px; font-size: 13px; font-weight: 600; color: var(--muted); }
  label small { font-weight: 400; color: var(--faint); }
  input[type=text], input[type=password] { background: var(--bg); color: var(--text); border: 1px solid #2e3a35; border-radius: 9px; padding: 9px 11px; }
  input:focus { outline: 2px solid var(--green-dark); outline-offset: -1px; }
  .check { display: flex; gap: 8px; align-items: flex-start; color: var(--text); font-weight: 500; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  .note { font-size: 13px; color: var(--muted); }
  .note a { color: #8fd3ff; }
  .error { color: #ff8a80; font-size: 14px; min-height: 1em; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1d2a24; border: 1px solid var(--border); padding: 10px 16px; border-radius: 10px; display: none; max-width: 90vw; }
  @media (max-width: 600px) { header, main { padding-left: 16px; padding-right: 16px; } }
</style>
</head>
<body>
<header>
  <h1>🚀 App Shipper <span>Expo → TestFlight</span></h1>
  <button class="btn" id="settingsBtn">⚙ Settings</button>
  <button class="btn primary" id="addBtn">＋ Add app</button>
</header>

<main>
  <div id="setupNote"></div>
  <section class="grid" id="apps"></section>
  <section class="panel" id="logPanel" hidden>
    <div class="panel-head">
      <h3 id="logTitle">Log</h3>
      <span class="chip" id="logStatus"></span>
      <button class="btn small" id="cancelBtn" hidden>Stop</button>
    </div>
    <div id="logHint"></div>
    <div class="links" id="logLinks"></div>
    <pre id="log"></pre>
  </section>
</main>

<dialog id="appDialog">
  <form id="appForm" method="dialog">
    <h2 id="appFormTitle">Add an app</h2>
    <label>Name <input type="text" name="name" placeholder="LANDRUSH" required></label>
    <label>Folder on this PC
      <small>Where the app is, or where to download it. Example: C:\Users\you\apps\landrush</small>
      <input type="text" name="folder" required>
    </label>
    <label>GitHub link <small>Only needed if the folder doesn't exist yet (it will be downloaded).</small>
      <input type="text" name="gitUrl" placeholder="https://github.com/you/your-app.git">
    </label>
    <label>Branch <small>Leave empty for the default branch.</small>
      <input type="text" name="branch" placeholder="main">
    </label>
    <label>App subfolder <small>Folder with app.json inside the repo. Leave empty to find it automatically.</small>
      <input type="text" name="appDir" placeholder="app">
    </label>
    <label>EAS build profile <input type="text" name="profile" value="production"></label>
    <div class="error" id="appError"></div>
    <div class="actions">
      <button class="btn" value="cancel" formnovalidate>Cancel</button>
      <button class="btn primary" id="appSave" value="save">Save</button>
    </div>
  </form>
</dialog>

<dialog id="settingsDialog">
  <form id="settingsForm" method="dialog">
    <h2>Settings</h2>
    <p class="note">Saved only on this PC. Keys and tokens never leave it except to Expo/Apple during a build.</p>
    <label>Expo access token
      <small>expo.dev → Account settings → Access tokens → Create. Lets App Shipper build without logging in.</small>
      <input type="password" name="expoToken" autocomplete="off">
    </label>
    <label>Apple key file (.p8)
      <small>Full path, e.g. C:\Users\you\Documents\keys\AuthKey_ABC123.p8 (App Store Connect → Users and Access → Integrations).</small>
      <input type="text" name="ascKeyPath">
    </label>
    <label>Apple Key ID <input type="text" name="ascKeyId"></label>
    <label>Apple Issuer ID <input type="text" name="ascIssuerId"></label>
    <label>Apple Team ID <input type="text" name="appleTeamId" placeholder="EYFA6K2Q5Y"></label>
    <label class="check"><input type="checkbox" name="skipCapabilitySync">
      <span>Skip Apple capability sync <small>(recommended with an API key; tick capabilities like Sign In with Apple once on developer.apple.com)</small></span>
    </label>
    <div class="row"><button class="btn small" type="button" id="toolsBtn">Check tools</button><span class="note" id="toolsOut"></span></div>
    <p class="note" id="configPath"></p>
    <div class="error" id="settingsError"></div>
    <div class="actions">
      <button class="btn" value="cancel" formnovalidate>Cancel</button>
      <button class="btn primary" value="save">Save</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>

<script>
const TOKEN = '__TOKEN__';
let state = { apps: [], settings: {}, jobs: [] };
let selectedApp = null;
let editingId = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: { 'x-token': TOKEN, 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
  return data;
}

function toast(text) {
  const t = $('toast');
  t.textContent = text;
  t.style.display = 'block';
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => (t.style.display = 'none'), 4500);
}

const STATUS = { running: 'Shipping…', ok: 'Sent ✓', failed: 'Failed', cancelled: 'Stopped' };
const lastJob = (appId) => state.jobs.filter((j) => j.appId === appId).at(-1);

function render() {
  const s = state.settings;
  const missing = [];
  if (!s.hasExpoToken) missing.push('an Expo access token');
  if (!s.ascKeyPath || !s.ascKeyId || !s.ascIssuerId) missing.push('your Apple key');
  $('setupNote').innerHTML = missing.length
    ? `<div class="hint" style="margin:0">Before shipping, add ${missing.join(' and ')} in <button class="btn link" onclick="openSettings()">Settings</button>.</div>`
    : '';

  if (!state.apps.length) {
    $('apps').innerHTML = `<div class="empty" style="grid-column:1/-1">No apps yet.<br><br><button class="btn primary" onclick="openApp()">＋ Add your first app</button></div>`;
  } else {
    $('apps').innerHTML = state.apps.map((a) => {
      const job = lastJob(a.id);
      const running = job?.status === 'running';
      return `<article class="card ${selectedApp === a.id ? 'selected' : ''}">
        <h2>${esc(a.name)} ${job ? `<span class="chip ${job.status}">${STATUS[job.status]}</span>` : ''}</h2>
        <div class="meta">
          <div>Bundle ID: <b>${esc(a.bundleId || '—')}</b> · Version <b>${esc(a.version || '—')}</b></div>
          <div>${esc(a.folder)}${a.appDir && a.appDir !== '.' ? ` → ${esc(a.appDir)}` : ''}</div>
          ${a.exists ? '' : '<div style="color:#ff8a80">Folder not found</div>'}
          ${a.projectId ? '' : '<div style="color:#ffd98a">Not linked to Expo yet (done automatically on first ship)</div>'}
        </div>
        <div class="row">
          <button class="btn primary" onclick="ship('${a.id}')" ${running ? 'disabled' : ''}>${running ? 'Shipping…' : 'Ship to TestFlight'}</button>
          <button class="btn small" onclick="showLog('${a.id}')" ${job ? '' : 'disabled'}>Log</button>
        </div>
        <div class="row">
          <button class="btn small" onclick="interactive('${a.id}')" title="For the first build of a new app, or if Apple asks questions">Open interactive window</button>
          <button class="btn small" onclick="openApp('${a.id}')">Edit</button>
          <button class="btn small danger" onclick="removeApp('${a.id}')">Remove</button>
        </div>
      </article>`;
    }).join('');
  }
  renderLog();
}

/** The log shown: the selected app's latest job, or the newest job overall. */
function currentJob() {
  return selectedApp ? (lastJob(selectedApp) ?? null) : (state.jobs.at(-1) ?? null);
}

function renderLog() {
  const job = currentJob();
  $('logPanel').hidden = !job;
  if (!job) return;
  $('logTitle').textContent = `${job.appName || 'App Shipper'} · ${job.step || (job.kind === 'clone' ? 'Download' : job.kind === 'tools' ? 'Tools' : 'Ship')}`;
  $('logStatus').className = `chip ${job.status}`;
  $('logStatus').textContent = STATUS[job.status];
  $('cancelBtn').hidden = job.status !== 'running';
  $('cancelBtn').onclick = () => api('POST', `/api/jobs/${job.id}/cancel`).catch((e) => toast(e.message));
  $('logHint').innerHTML = job.hint ? `<div class="hint">💡 ${esc(job.hint)}</div>` : '';
  $('logLinks').innerHTML = job.links.map((l) => `<a href="${esc(l)}" target="_blank" rel="noopener">${esc(l)}</a>`).join('');
  const pre = $('log');
  const atBottom = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 30;
  pre.innerHTML = (job.lines || []).map(lineHtml).join('\n');
  if (atBottom) pre.scrollTop = pre.scrollHeight;
}

const lineHtml = (l) => l.startsWith('▶') ? `<span class="step">${esc(l)}</span>` : l.startsWith('$ ') ? `<span class="cmd">${esc(l)}</span>` : esc(l);

async function load() {
  state = await api('GET', '/api/state');
  render();
}

function connect() {
  const es = new EventSource(`/api/events?t=${TOKEN}`);
  es.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    if (ev.type === 'job') {
      const existing = state.jobs.find((j) => j.id === ev.job.id);
      if (existing) Object.assign(existing, ev.job);
      else state.jobs.push({ ...ev.job, lines: [] });
      render();
    } else if (ev.type === 'log') {
      const job = state.jobs.find((j) => j.id === ev.jobId);
      if (!job) return;
      job.lines.push(ev.line);
      if (job === currentJob()) {
        const pre = $('log');
        const atBottom = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 30;
        pre.insertAdjacentHTML('beforeend', (pre.innerHTML ? '\n' : '') + lineHtml(ev.line));
        if (atBottom) pre.scrollTop = pre.scrollHeight;
      }
    } else if (ev.type === 'config') {
      load();
    }
  };
  es.onerror = () => toast('Lost connection to App Shipper. Is the Ship.cmd window still open?');
}

async function ship(id) {
  selectedApp = id;
  try {
    await api('POST', `/api/apps/${id}/ship`, {});
  } catch (e) {
    toast(e.message);
  }
  render();
  $('logPanel').scrollIntoView({ behavior: 'smooth' });
}

function showLog(id) {
  selectedApp = id;
  render();
  $('logPanel').scrollIntoView({ behavior: 'smooth' });
}

async function interactive(id) {
  try {
    const r = await api('POST', `/api/apps/${id}/interactive`, {});
    toast(r.message);
  } catch (e) {
    toast(e.message);
  }
}

async function removeApp(id) {
  const app = state.apps.find((a) => a.id === id);
  if (!confirm(`Remove ${app.name} from App Shipper? (Its folder stays on your PC.)`)) return;
  Object.assign(state, await api('DELETE', `/api/apps/${id}`));
  render();
}

function openApp(id) {
  editingId = id ?? null;
  const form = $('appForm');
  form.reset();
  $('appError').textContent = '';
  $('appFormTitle').textContent = id ? 'Edit app' : 'Add an app';
  if (id) {
    const a = state.apps.find((x) => x.id === id);
    for (const k of ['name', 'folder', 'gitUrl', 'branch', 'appDir', 'profile']) form.elements[k].value = a[k] ?? '';
  }
  $('appDialog').showModal();
}

$('appForm').addEventListener('submit', async (e) => {
  if (e.submitter?.value !== 'save') return;
  e.preventDefault();
  const body = Object.fromEntries(new FormData(e.target));
  try {
    const r = editingId ? await api('PUT', `/api/apps/${editingId}`, body) : await api('POST', '/api/apps', body);
    if (r.cloning) {
      toast('Downloading the app… follow the log below.');
      selectedApp = null;
    } else {
      Object.assign(state, r);
    }
    $('appDialog').close();
    render();
  } catch (err) {
    $('appError').textContent = err.message;
  }
});

function openSettings() {
  const f = $('settingsForm');
  const s = state.settings;
  f.elements.expoToken.value = s.expoToken || '';
  f.elements.expoToken.placeholder = s.hasExpoToken ? '' : 'paste token';
  for (const k of ['ascKeyPath', 'ascKeyId', 'ascIssuerId', 'appleTeamId']) f.elements[k].value = s[k] || '';
  f.elements.skipCapabilitySync.checked = s.skipCapabilitySync !== false;
  $('configPath').textContent = `Settings file: ${state.configFile}`;
  $('settingsError').textContent = '';
  $('toolsOut').textContent = '';
  $('settingsDialog').showModal();
}

$('settingsForm').addEventListener('submit', async (e) => {
  if (e.submitter?.value !== 'save') return;
  e.preventDefault();
  const f = e.target;
  const body = Object.fromEntries(new FormData(f));
  body.skipCapabilitySync = f.elements.skipCapabilitySync.checked;
  try {
    const r = await api('PUT', '/api/settings', body);
    Object.assign(state, r);
    if (r.warning) return ($('settingsError').textContent = r.warning);
    $('settingsDialog').close();
    toast('Settings saved.');
    render();
  } catch (err) {
    $('settingsError').textContent = err.message;
  }
});

$('toolsBtn').onclick = async () => {
  $('toolsOut').textContent = 'Checking…';
  const t = await api('POST', '/api/tools');
  const part = (name, v) => `${name}: ${v ? '✓ ' + v : '✗ missing'}`;
  $('toolsOut').innerHTML = [part('Node', t.node), part('Git', t.git), part('pnpm', t.pnpm)].map(esc).join(' · ')
    + (t.pnpm ? '' : ' <button class="btn small" type="button" id="installPnpm">Install pnpm</button>')
    + (t.git ? '' : ' · <a href="https://git-scm.com/download/win" target="_blank">Get Git</a>');
  const btn = $('installPnpm');
  if (btn) btn.onclick = async () => { await api('POST', '/api/install-pnpm'); toast('Installing pnpm… see the log.'); $('settingsDialog').close(); };
};

$('settingsBtn').onclick = openSettings;
$('addBtn').onclick = () => openApp();
load().then(connect).catch((e) => toast(e.message));
</script>
</body>
</html>
