# LANDRUSH production stack. Run from this folder: docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: landrush
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: landrush
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U landrush']
      interval: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://landrush:${POSTGRES_PASSWORD}@db:5432/landrush
      MIN_APP_VERSION: ${MIN_APP_VERSION:-0.1.0}
    # Only reachable from the VPS itself; Nginx handles HTTPS in front of it.
    ports:
      - '127.0.0.1:3100:3000'

volumes:
  pgdata:
